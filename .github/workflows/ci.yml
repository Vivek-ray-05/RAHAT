name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rahat
          POSTGRES_PASSWORD: rahat
          POSTGRES_DB: rahat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rahat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-not-for-real-use
      DEV_MODE: "true"
      DATABASE_URL: postgresql+psycopg://rahat:rahat@localhost:5432/rahat_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Bandit (fail on medium+ severity)
        working-directory: backend
        run: python -m bandit -r app/ -ll

      - name: pip-audit (report only, not a merge gate yet)
        working-directory: backend
        run: python -m pip_audit -r requirements.txt || true

      - name: Run test suite
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (fail on high+ severity)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Production build
        working-directory: frontend
        run: npm run build

  docker-compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Write a throwaway backend/.env for the smoke test
        run: cp .env.example backend/.env

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose logs
          exit 1

      - name: Confirm frontend is serving
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "frontend never came up"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
