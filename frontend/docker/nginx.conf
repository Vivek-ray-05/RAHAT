server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # React Router uses client-side routing -- any path that isn't a
    # real static file falls back to index.html so the app's own
    # router handles it, instead of nginx 404ing on a hard refresh at
    # e.g. /dashboard/zone.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
