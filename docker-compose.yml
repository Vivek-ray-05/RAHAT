services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rahat
      POSTGRES_PASSWORD: rahat
      POSTGRES_DB: rahat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A real Mosquitto broker -- not a mock -- so mqtt_adapter.py can be
  # demonstrated and tested against a genuine publish/subscribe round
  # trip. The stock image's default config already listens on 1883
  # with anonymous pub/sub, which is fine for this local/demo broker.
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: rahat-backend:latest
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rahat:rahat@postgres:5432/rahat
      REDIS_URL: redis://redis:6379/0
      UVICORN_RELOAD: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # A second backend instance sharing the same Postgres+Redis as
  # `backend` -- exists to prove that Redis-backed state (OTP store,
  # rate limiter, WS pub/sub) is genuinely shared across processes,
  # not just working by accident because there's only ever one worker.
  backend2:
    image: rahat-backend:latest
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rahat:rahat@postgres:5432/rahat
      REDIS_URL: redis://redis:6379/0
      UVICORN_RELOAD: "true"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
